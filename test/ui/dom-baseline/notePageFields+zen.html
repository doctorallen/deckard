<body
  class="zen"
  data-cards="flat"
  data-controls="quiet"
  data-density="compact"
  data-help="hidden"
  data-styling="plain"
  data-tags="text"
> <main
    id="app"
  ><header
      class="page-bar"
    ><div
        class="note-lead page-bar-lead"
      ><p
          class="eyebrow"
        ><button
            aria-expanded="false"
            aria-haspopup="menu"
            aria-label="Deckard: go to another page"
            class="eyebrow-home"
            data-go-to=""
            type="button"
          >DECKARD ▾</button
          ><span
            class="eyebrow-trail"
          > / NOTE / DECISIONS</span
          ></p
        ><h1
          class="note-text"
        >ADR-001 Card form</h1
        ><nav
          aria-label="Where this note sits"
          class="note-breadcrumbs"
        ><p
            class="note-breadcrumb"
          ><span
              class="note-crumb"
            >People</span
            ><span
              aria-hidden="true"
              class="note-crumb-join"
            > › </span
            ><button
              class="note-crumb"
              data-action="open-note"
              data-file-path="People/Dana Whitfield.md"
              type="button"
            >Dana Whitfield</button
            ><span
              aria-hidden="true"
              class="note-crumb-join"
            > › </span
            ><span
              class="is-current note-crumb"
            >ADR-001 Card form</span
            ></p
          ><p
            class="note-breadcrumb"
          ><span
              class="note-crumb"
            >People</span
            ><span
              aria-hidden="true"
              class="note-crumb-join"
            > › </span
            ><button
              class="note-crumb"
              data-action="open-note"
              data-file-path="People/Omar Haddad.md"
              type="button"
            >Omar Haddad</button
            ><span
              aria-hidden="true"
              class="note-crumb-join"
            > › </span
            ><span
              class="is-current note-crumb"
            >ADR-001 Card form</span
            ></p
          ></nav
        ></div
      ><div
        aria-label="Note"
        class="page-bar-actions"
        data-query-keeps-text=""
        role="group"
      ><span
          aria-label="Note history"
          class="history-buttons"
          role="group"
        ><button
            aria-label="Back to the note before"
            class="icon-button"
            data-action="history-back"
            data-tip="Back to the note before"
            type="button"
          >‹</button
          ><button
            aria-disabled="true"
            aria-label="Forward to the next note"
            class="icon-button"
            data-action="history-forward"
            data-tip="Forward to the next note"
            data-tip-disabled="No note after this one"
            type="button"
          >›</button
          ></span
        ><button
          data-action="open-in-editor"
          data-tip="Open this note in the editor · Cmd/Ctrl-click: beside"
          type="button"
        >Open in Editor</button
        ><details
          class="page-menu view-options"
        ><summary
            aria-label="More: Edit fields, Theme, Zen, and more"
            data-tip="More: Edit fields, Theme, Zen, and more"
          ><svg
              aria-hidden="true"
              class="toolbar-icon"
              fill="none"
              focusable="false"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
              viewBox="0 0 16 16"
            ><circle
                cx="3.5"
                cy="8"
                fill="currentColor"
                r="1.1"
                stroke="none"
              ></circle
              ><circle
                cx="8"
                cy="8"
                fill="currentColor"
                r="1.1"
                stroke="none"
              ></circle
              ><circle
                cx="12.5"
                cy="8"
                fill="currentColor"
                r="1.1"
                stroke="none"
              ></circle
              ></svg
            ></summary
          ><div
            class="is-dropdown popover view-options-menu"
          ><div
              aria-label="Page"
              class="view-options-section"
              role="group"
            ><button
                class="menu-item view-options-item"
                data-action="edit-fields"
                data-tip="Edit this decision's fields in a form"
                type="button"
              ><span
                  class="menu-label"
                >Edit fields…</span
                ></button
              ></div
            ><div
              aria-label="Appearance"
              class="view-options-section"
              role="group"
            ><div
                aria-hidden="true"
                class="view-options-heading"
              >Appearance</div
              ><div
                class="view-options-group"
              ><span
                >Theme</span
                ><button
                  aria-label="Theme: Replicant. Choose another"
                  class="theme-choice"
                  data-action="choose-theme"
                  type="button"
                >Replicant…</button
                ></div
              ><div
                class="view-options-group"
              ><label
                  for="view-options-zen"
                >Zen</label
                ><input
                  class="view-options-check"
                  data-action="set-zen"
                  data-dom-checked="true"
                  data-dom-value="on"
                  id="view-options-zen"
                  type="checkbox"
                ></div
              ><div
                class="view-options-group"
              ><span
                >Page width</span
                ><div
                  aria-label="Page width"
                  class="segmented view-options-choices"
                  role="group"
                ><button
                    aria-pressed="true"
                    class="active"
                    data-action="set-display"
                    data-display="pageWidth"
                    data-value="limited"
                    type="button"
                  >Limited</button
                  ><button
                    aria-pressed="false"
                    data-action="set-display"
                    data-display="pageWidth"
                    data-value="full"
                    type="button"
                  >Full</button
                  ></div
                ></div
              ></div
            ><div
              aria-label="Help"
              class="view-options-section"
              role="group"
            ><button
                class="menu-item view-options-item"
                data-action="page-help"
                type="button"
              ><span
                  class="menu-label"
                >Help on this page</span
                ></button
              ></div
            ></div
          ></details
        ></div
      ></header
    ><section
      aria-label="Decision fields"
      class="note-fields"
      data-zen-region=""
    ><p
        class="note-fields-type"
      ><button
          class="type-link"
          data-action="open-search"
          data-query="type = decision"
          data-tip="Search every decision: type = decision"
          type="button"
        >Decision</button
        ></p
      ><dl
        class="field-rows"
      ><div
          class="field-row"
          data-field-key="decided-by"
        ><dt
            class="field-name"
          ><button
              class="field-name-link"
              data-action="edit-fields"
              data-field-key="decided-by"
              data-tip="Edit decided-by"
              type="button"
            >decided-by</button
            ></dt
          ><dd
            class="field-values"
          ><button
              class="field-link field-value"
              data-action="open-tag"
              data-tag-key="@dana"
              data-tip="Open @dana"
              type="button"
            >Dana Whitfield</button
            >, <button
              class="field-link field-value"
              data-action="open-tag"
              data-tag-key="@omar"
              data-tip="Open @omar"
              type="button"
            >Omar Haddad</button
            ></dd
          ></div
        ><div
          class="field-row"
          data-field-key="status"
        ><dt
            class="field-name"
          ><button
              class="field-name-link"
              data-action="edit-fields"
              data-field-key="status"
              data-tip="Edit status"
              type="button"
            >status</button
            ></dt
          ><dd
            class="field-values"
          ><span
              class="field-value"
            >accepted</span
            ></dd
          ></div
        ></dl
      ><p
        class="note-fields-edit"
      ><button
          class="tag-note-action"
          data-action="edit-fields"
          data-tip="Edit this decision's fields in a form"
          data-zen-reveal=""
          type="button"
        >Edit fields…</button
        ></p
      ></section
    ><article
      aria-label="ADR-001 Card form"
      class="note-body"
    ><p
        data-line="7"
      >Card details are taken in a hosted form, never on our servers.</p
      ></article
    ></main
  > <div
    aria-live="polite"
    class="visually-hidden"
    id="live-status"
    role="status"
  ></div
  > </body
>
