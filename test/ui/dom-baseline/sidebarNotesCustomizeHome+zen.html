<body
  class="zen"
  data-cards="flat"
  data-counts="hidden"
  data-dates="relative"
  data-density="compact"
  data-file-line="never"
  data-help="hidden"
  data-level="zen"
  data-styling="plain"
  data-tags="text"
> <main
    data-preview-lines="1"
    data-sidebar=""
    id="app"
  ><div
      class="active-file"
    ><div
        class="active-label"
      >Home</div
      ><div
        class="active-name"
      >Customize</div
      ></div
    ><span
      class="section-label"
    >Add a widget</span
    ><ul
      class="home-widget-choices"
    ><li
      ><button
          class="home-widget-choice"
          data-action="home-add-widget"
          data-tip="The tasks a search finds, ranked as on the Task Board"
          data-value="tasks"
          type="button"
        ><span
            class="home-widget-choice-label"
          >+ Tasks</span
          ><span
            class="home-widget-choice-detail"
          >The tasks a search finds, ranked as on the Task Board</span
          ></button
        ></li
      ><li
      ><button
          class="home-widget-choice"
          data-action="home-add-widget"
          data-tip="The tags you open most, lately"
          data-value="topTags"
          type="button"
        ><span
            class="home-widget-choice-label"
          >+ Frequent tags</span
          ><span
            class="home-widget-choice-detail"
          >The tags you open most, lately</span
          ></button
        ></li
      ><li
      ><button
          class="home-widget-choice"
          data-action="home-add-widget"
          data-tip="Today's daily note and its open tasks"
          data-value="todayNote"
          type="button"
        ><span
            class="home-widget-choice-label"
          >+ Today</span
          ><span
            class="home-widget-choice-detail"
          >Today's daily note and its open tasks</span
          ></button
        ></li
      ></ul
    ><button
      class="home-reset-widgets"
      data-action="home-reset-widgets"
      data-tip="Put back the widgets Home started with"
      type="button"
    >Reset widgets…</button
    ></main
  > <div
    aria-live="polite"
    class="visually-hidden"
    id="live-status"
    role="status"
  ></div
  > </body
>
