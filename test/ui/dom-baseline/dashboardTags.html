<body
> <main
    id="app"
  ><header
      class="page-bar"
    ><div
        class="page-bar-lead"
      ><p
          class="eyebrow"
        ><button
            aria-expanded="false"
            aria-haspopup="menu"
            aria-label="Deckard: go to another page"
            class="eyebrow-home"
            data-go-to=""
            type="button"
          >DECKARD ▾</button
          ><span
            class="eyebrow-trail"
          > / WORKSPACE INDEX</span
          ></p
        ><h1
        >Home</h1
        ></div
      ><div
        aria-label="Home"
        class="dashboard-header-actions page-bar-actions"
        data-query-keeps-text=""
        role="group"
      ><div
          aria-label="Tasks at a glance"
          class="metrics"
          role="group"
        ><button
            aria-label="Due today, 3. Search what is due today"
            class="metric metric-open"
            data-action="open-search"
            data-code="TSK.DUE // 01"
            data-query="is:today"
            data-tip="Search what is due today"
            type="button"
          ><span
              class="metric-label"
            >Due today</span
            ><strong
              class="metric-value"
            >3</strong
            ></button
          ><button
            aria-label="Overdue, 6. Search the overdue tasks"
            class="metric metric-open"
            data-action="open-search"
            data-code="TSK.OVR // 02"
            data-query="is:overdue -is:needs-date"
            data-tip="Search the overdue tasks"
            type="button"
          ><span
              class="metric-label"
            >Overdue</span
            ><strong
              class="metric-value"
            >6</strong
            ></button
          ><button
            aria-label="Done this week, 0. Search the tasks finished this week"
            class="metric metric-open"
            data-action="open-search"
            data-code="TSK.DON // 03"
            data-query="done >= this-week"
            data-tip="Search the tasks finished this week"
            type="button"
          ><span
              class="metric-label"
            >Done this week</span
            ><strong
              class="metric-value"
            >0</strong
            ></button
          ></div
        ><details
          class="page-menu view-options"
        ><summary
            aria-label="More: Customize Home, Walkthrough, Tag columns, and more"
            data-tip="More: Customize Home, Walkthrough, Tag columns, and more"
          ><svg
              aria-hidden="true"
              class="toolbar-icon"
              fill="none"
              focusable="false"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
              viewBox="0 0 16 16"
            ><circle
                cx="3.5"
                cy="8"
                fill="currentColor"
                r="1.1"
                stroke="none"
              ></circle
              ><circle
                cx="8"
                cy="8"
                fill="currentColor"
                r="1.1"
                stroke="none"
              ></circle
              ><circle
                cx="12.5"
                cy="8"
                fill="currentColor"
                r="1.1"
                stroke="none"
              ></circle
              ></svg
            ></summary
          ><div
            class="is-dropdown popover view-options-menu"
          ><div
              aria-label="Page"
              class="view-options-section"
              role="group"
            ><button
                class="menu-item view-options-item"
                data-action="customize-home"
                data-tip="Add, arrange, size and remove Home's widgets"
                type="button"
              ><span
                  class="menu-label"
                >Customize Home…</span
                ></button
              ><button
                class="menu-item view-options-item"
                data-action="open-view"
                data-tip="Six steps through Deckard, checked off as you do them"
                data-view="walkthrough"
                type="button"
              ><span
                  class="menu-label"
                >Walkthrough</span
                ></button
              ></div
            ><div
              aria-label="View"
              class="view-options-section"
              role="group"
            ><div
                aria-hidden="true"
                class="view-options-heading"
              >View</div
              ><div
                class="view-options-group"
              ><span
                >Tag columns</span
                ><div
                  aria-label="Tag columns"
                  class="segmented view-options-choices"
                  role="group"
                ><button
                    aria-label="1 columns"
                    aria-pressed="false"
                    data-action="set-columns"
                    data-section="tags"
                    data-value="1"
                    type="button"
                  >1</button
                  ><button
                    aria-label="2 columns"
                    aria-pressed="true"
                    class="active"
                    data-action="set-columns"
                    data-section="tags"
                    data-value="2"
                    type="button"
                  >2</button
                  ><button
                    aria-label="3 columns"
                    aria-pressed="false"
                    data-action="set-columns"
                    data-section="tags"
                    data-value="3"
                    type="button"
                  >3</button
                  ><button
                    aria-label="4 columns"
                    aria-pressed="false"
                    data-action="set-columns"
                    data-section="tags"
                    data-value="4"
                    type="button"
                  >4</button
                  ></div
                ></div
              ></div
            ><div
              aria-label="Appearance"
              class="view-options-section"
              role="group"
            ><div
                aria-hidden="true"
                class="view-options-heading"
              >Appearance</div
              ><div
                class="view-options-group"
              ><span
                >Theme</span
                ><button
                  aria-label="Theme: Replicant. Choose another"
                  class="theme-choice"
                  data-action="choose-theme"
                  type="button"
                >Replicant…</button
                ></div
              ><div
                class="view-options-group"
              ><label
                  for="view-options-zen"
                >Zen</label
                ><input
                  class="view-options-check"
                  data-action="set-zen"
                  data-dom-checked="false"
                  data-dom-value="on"
                  id="view-options-zen"
                  type="checkbox"
                ></div
              ><div
                class="view-options-group"
              ><span
                >Page width</span
                ><div
                  aria-label="Page width"
                  class="segmented view-options-choices"
                  role="group"
                ><button
                    aria-pressed="true"
                    class="active"
                    data-action="set-display"
                    data-display="pageWidth"
                    data-value="limited"
                    type="button"
                  >Limited</button
                  ><button
                    aria-pressed="false"
                    data-action="set-display"
                    data-display="pageWidth"
                    data-value="full"
                    type="button"
                  >Full</button
                  ></div
                ></div
              ></div
            ><div
              aria-label="Help"
              class="view-options-section"
              role="group"
            ><button
                class="menu-item view-options-item"
                data-action="page-help"
                type="button"
              ><span
                  class="menu-label"
                >Help on this page</span
                ></button
              ></div
            ></div
          ></details
        ></div
      ></header
    ><div
      class="dashboard-tabs-row"
      data-zen-region=""
    ><div
        aria-label="Home tabs"
        class="dashboard-tabs segmented"
        role="tablist"
      ><button
          aria-controls="home-panel"
          aria-selected="false"
          data-action="set-dashboard-mode"
          data-dashboard-mode="home"
          id="home-tab"
          role="tab"
          tabindex="-1"
        >Home</button
        ><button
          aria-controls="browse-panel"
          aria-selected="true"
          data-action="set-dashboard-mode"
          data-dashboard-mode="browse"
          id="browse-tab"
          role="tab"
          tabindex="0"
        >Tags</button
        ></div
      ></div
    ><section
      aria-labelledby="home-tab"
      class="dashboard-panel"
      hidden=""
      id="home-panel"
      role="tabpanel"
    ></section
    ><section
      aria-labelledby="browse-tab"
      class="dashboard-panel"
      id="browse-panel"
      role="tabpanel"
    ><div
        class="browse-toolbar"
      ><div
          class="browse-toolbar-controls"
        ><input
            aria-label="Search tags"
            autocomplete="off"
            class="catalog-search"
            data-action="search-browse"
            data-dom-value=""
            placeholder="Search tags"
            type="search"
          ><div
            class="control-row"
          ><label
              class="control-label"
            >Namespace:<span
                class="control-icon"
              ><select
                  aria-label="Filter tags by namespace"
                  data-action="set-tag-namespace"
                  data-dom-value=""
                ><option
                    data-dom-selected="true"
                    data-dom-value=""
                  >All</option
                  ><option
                    data-dom-selected="false"
                    data-dom-value="meeting"
                  >Meeting</option
                  ><option
                    data-dom-selected="false"
                    data-dom-value="person"
                  >Person</option
                  ><option
                    data-dom-selected="false"
                    data-dom-value="project"
                  >Project</option
                  ><option
                    data-dom-selected="false"
                    data-dom-value="status"
                  >Status</option
                  ><option
                    data-dom-selected="false"
                    data-dom-value="topic"
                  >Topic</option
                  ></select
                ><svg
                  aria-hidden="true"
                  class="control-icon-svg"
                  fill="none"
                  focusable="false"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.5"
                  viewBox="0 0 16 16"
                ><path
                    d="M2 3h12L9 8v4l-2 1V8L2 3Z"
                  ></path
                  ></svg
                ></span
              ></label
            ><label
              class="control-label"
            >Sort:<span
                class="control-icon"
              ><select
                  aria-label="Sort tags"
                  data-action="set-sort"
                  data-dom-value="alphabetical"
                ><option
                    data-dom-selected="true"
                    data-dom-value="alphabetical"
                  >A-Z</option
                  ><option
                    data-dom-selected="false"
                    data-dom-value="count"
                  >Entry Count</option
                  ><option
                    data-dom-selected="false"
                    data-dom-value="access"
                  >Most accessed</option
                  ><option
                    data-dom-selected="false"
                    data-dom-value="custom"
                  >Rank</option
                  ></select
                ><svg
                  aria-hidden="true"
                  class="control-icon-svg"
                  fill="none"
                  focusable="false"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.5"
                  viewBox="0 0 16 16"
                ><path
                    d="M5 3v10m-2-8 2-2 2 2m4 8V3m-2 8 2 2 2-2"
                  ></path
                  ></svg
                ></span
              ></label
            ></div
          ></div
        ></div
      ><div
        class="tag-group"
        data-tag-group="other"
      ><h3
        >Other tags <span
            class="tag-count"
          >(6)</span
          ></h3
        ><div
          class="tag-list"
          style="grid-template-columns: repeat(2, 1fr)"
        ><div
            class="row tag-row"
            data-tag-key="#project/atlas"
            data-tip-around=""
            draggable="false"
            tabindex="0"
          ><div
              class="tag-main"
            ><span
                class="tag-name"
              >atlas</span
              ><span
                class="tag-count"
              >14</span
              ></div
            ><div
              class="tag-actions"
            ><span
                class="entity-kind"
              >project</span
              ><button
                aria-label="Favorite atlas project"
                class="favorite-toggle"
                data-action="favorite-tag"
                data-tag-key="#project/atlas"
              ><span
                  aria-hidden="true"
                  class="favorite-heart"
                ></span
                ></button
              ></div
            ></div
          ><div
            class="row tag-row"
            data-tag-key="@dana"
            data-tip-around=""
            draggable="false"
            tabindex="0"
          ><div
              class="tag-main"
            ><span
                class="tag-name"
              >dana</span
              ><span
                class="tag-count"
              >15</span
              ></div
            ><div
              class="tag-actions"
            ><span
                class="entity-kind"
              >person</span
              ><button
                aria-label="Favorite dana person"
                class="favorite-toggle"
                data-action="favorite-tag"
                data-tag-key="@dana"
              ><span
                  aria-hidden="true"
                  class="favorite-heart"
                ></span
                ></button
              ></div
            ></div
          ><div
            class="row tag-row"
            data-tag-key="#status/doing"
            data-tip-around=""
            draggable="false"
            tabindex="0"
          ><div
              class="tag-main"
            ><span
                class="tag-name"
              >doing</span
              ><span
                class="tag-count"
              >40</span
              ></div
            ><div
              class="tag-actions"
            ><span
                class="entity-kind"
              >status</span
              ><button
                aria-label="Favorite doing status"
                class="favorite-toggle"
                data-action="favorite-tag"
                data-tag-key="#status/doing"
              ><span
                  aria-hidden="true"
                  class="favorite-heart"
                ></span
                ></button
              ></div
            ></div
          ><div
            class="row tag-row"
            data-tag-key="@ren-kade"
            data-tip-around=""
            draggable="false"
            tabindex="0"
          ><div
              class="tag-main"
            ><span
                class="tag-name"
              >ren kade</span
              ><span
                class="tag-count"
              >1</span
              ></div
            ><div
              class="tag-actions"
            ><span
                class="entity-kind"
              >person</span
              ><button
                aria-label="Favorite ren kade person"
                class="favorite-toggle"
                data-action="favorite-tag"
                data-tag-key="@ren-kade"
              ><span
                  aria-hidden="true"
                  class="favorite-heart"
                ></span
                ></button
              ></div
            ></div
          ><div
            class="row tag-row"
            data-tag-key="#topic/replicants"
            data-tip-around=""
            draggable="false"
            tabindex="0"
          ><div
              class="tag-main"
            ><span
                class="tag-name"
              >replicants</span
              ><span
                class="tag-count"
              >13</span
              ></div
            ><div
              class="tag-actions"
            ><span
                class="entity-kind"
              >topic</span
              ><button
                aria-label="Favorite replicants topic"
                class="favorite-toggle"
                data-action="favorite-tag"
                data-tag-key="#topic/replicants"
              ><span
                  aria-hidden="true"
                  class="favorite-heart"
                ></span
                ></button
              ></div
            ></div
          ><div
            class="row tag-row"
            data-tag-key="#meeting/standup"
            data-tip-around=""
            draggable="false"
            tabindex="0"
          ><div
              class="tag-main"
            ><span
                class="tag-name"
              >standup</span
              ><span
                class="tag-count"
              >1</span
              ></div
            ><div
              class="tag-actions"
            ><span
                class="entity-kind"
              >meeting</span
              ><button
                aria-label="Favorite standup meeting"
                class="favorite-toggle"
                data-action="favorite-tag"
                data-tag-key="#meeting/standup"
              ><span
                  aria-hidden="true"
                  class="favorite-heart"
                ></span
                ></button
              ></div
            ></div
          ></div
        ></div
      ></section
    ></main
  > <div
    aria-live="polite"
    class="visually-hidden"
    id="live-status"
    role="status"
  ></div
  > </body
>
