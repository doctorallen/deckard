name: Prepare Release

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: prepare-release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  bump-version:
    if: github.event.pull_request.head.ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Increment version when needed
        id: version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base_version="$(git show "$BASE_SHA:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
          current_version="$(node -p "require('./package.json').version")"
          if [ "$current_version" != "$base_version" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version is already $current_version."
            exit 0
          fi

          npm version patch --no-git-tag-version --ignore-scripts
          echo "changed=true" >> "$GITHUB_OUTPUT"
          version="$(node -p "require('./package.json').version")"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Commit version update
        if: steps.version.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: prepare release v$VERSION"
          git push origin "HEAD:$HEAD_REF"
