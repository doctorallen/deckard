name: Prepare Release

on:
  pull_request:
    branches:
      - main
      - master
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: prepare-release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  bump-version:
    if: github.event.pull_request.head.ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # A commit pushed with the workflow's own token starts no workflow, so
      # CI would never check the version commit. Pushed with a token of the
      # repository's release app (vars.RELEASE_APP_ID and
      # secrets.RELEASE_APP_PRIVATE_KEY), it does. Without the app it falls
      # back to the workflow's token, and the release checks the merge.
      - name: Make a token that starts CI
        id: app-token
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Check out pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - name: Determine release version
        id: version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base_version="$(git show "$BASE_SHA:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
          current_version="$(node -p "require('./package.json').version")"
          commit_messages="$(git log --format='%B' --no-merges "$BASE_SHA..HEAD")"
          version_commits="$(git log --format='%s' --no-merges "$BASE_SHA..HEAD" -- package.json)"
          explicit_version=false
          if [ "$current_version" != "$base_version" ] && printf '%s\n' "$version_commits" | grep -Evq '^chore: prepare release v[0-9]+\.[0-9]+\.[0-9]+$'; then
            explicit_version=true
          fi

          echo "base_version=$base_version" >> "$GITHUB_OUTPUT"

          if [ "$explicit_version" = true ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "value=$current_version" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Version is explicitly set to $current_version."
            exit 0
          fi

          if printf '%s\n' "$commit_messages" | grep -Eiq '^[a-z]+(\([^)]+\))?!:|BREAKING CHANGE:'; then
            bump=major
          elif printf '%s\n' "$commit_messages" | grep -Eiq '^feat(\([^)]+\))?:'; then
            bump=minor
          elif printf '%s\n' "$commit_messages" | grep -Eiq '^fix(\([^)]+\))?:'; then
            bump=patch
          else
            bump=none
          fi

          if [ "$bump" = none ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No release-level Conventional Commit was found."
            exit 0
          fi

          version="$(node - "$base_version" "$bump" <<'NODE'
          const [version, bump] = process.argv.slice(2);
          const match = /^(\d+)\.(\d+)\.(\d+)(?:-.+)?$/.exec(version);
          if (!match) throw new Error(`Invalid semantic version: ${version}`);
          const [major, minor, patch] = match.slice(1).map(Number);
          const next = bump === 'major'
            ? [major + 1, 0, 0]
            : bump === 'minor'
              ? [major, minor + 1, 0]
              : [major, minor, patch + 1];
          console.log(next.join('.'));
          NODE
          )"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"
          if [ "$current_version" = "$version" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version is already $version."
            exit 0
          fi

          npm version "$version" --no-git-tag-version --allow-same-version --ignore-scripts
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Unreleased becomes the version's own section, which the release page
      # and the Extensions view's Changelog tab both read. A feature release
      # fails here until its Highlights are written.
      - name: Cut the changelog
        if: steps.version.outputs.release == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VERSION: ${{ steps.version.outputs.value }}
          BASE_VERSION: ${{ steps.version.outputs.base_version }}
        run: |
          git log --format=%s --no-merges "$BASE_SHA..HEAD" > "$RUNNER_TEMP/commits.txt"
          node scripts/changelog.js cut "$VERSION" "$(TZ=America/New_York date +%F)" "$BASE_VERSION" "$RUNNER_TEMP/commits.txt"

      - name: Commit version update
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -z "$(git status --porcelain -- package.json package-lock.json CHANGELOG.md)" ]; then
            echo "The version and the changelog are already cut."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore: prepare release v$VERSION"
          git push origin "HEAD:$HEAD_REF"
