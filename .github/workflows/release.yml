name: Release

on:
  push:
    branches:
      - main
      - master
  # Rewrites every release's notes from its section of the changelog, for
  # when an older section was corrected after it shipped.
  workflow_dispatch:

permissions:
  contents: write
  # The Marketplace publish signs in to Microsoft Entra with GitHub's OIDC
  # token, so no publishing secret is stored.
  id-token: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Every suite CI runs, run again on the merged source: a merge whose CI run
  # was cancelled, or that CI never saw, is not released untested.
  validate:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  release:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out merged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read release version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Verify version has not already been released
        id: tag
        env:
          TAG_NAME: v${{ steps.version.outputs.value }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/$TAG_NAME"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release VSIX
        if: steps.tag.outputs.exists != 'true'
        run: npm run package:vsix

      - name: Read the release notes from the changelog
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: node scripts/changelog.js notes "$VERSION" > "$RUNNER_TEMP/notes.md"

      - name: Create release and attach VSIX
        if: steps.tag.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v${{ steps.version.outputs.value }}
        run: |
          vsix_path="$(find . -maxdepth 1 -type f -name '*.vsix' -print -quit)"
          test -n "$vsix_path"
          # The changelog's section for this version, or GitHub's list of
          # pull requests when there is none.
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            notes=(--notes-file "$RUNNER_TEMP/notes.md")
          else
            notes=(--generate-notes)
          fi
          gh release create "$TAG_NAME" "$vsix_path" \
            "${notes[@]}" \
            --target "$GITHUB_SHA" \
            --title "Deckard $TAG_NAME" \
            --repo "$GITHUB_REPOSITORY"

      # The Marketplace is checked rather than the tag, so re-running a job
      # whose release was made but whose publish failed still publishes.
      - name: Check whether the Marketplace has this version
        id: marketplace
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          published="$(npx vsce show esperinnovations.deckard-notes --json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).versions[0].version")"
          echo "Marketplace has $published; this build is $VERSION."
          if [ "$published" = "$VERSION" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      # The app registration esper-themes-publish trusts this repository's
      # master branch; its IDs are repository variables, not secrets.
      - name: Sign in to Microsoft Entra
        if: steps.marketplace.outputs.needed == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # The publisher's Members page takes this ID, not the app's client ID.
      # It names an identity, not a credential, so it is safe in the log.
      - name: Show the identity the Marketplace sees
        if: steps.marketplace.outputs.needed == 'true'
        run: |
          az rest \
            --uri "https://app.vssps.visualstudio.com/_apis/profile/profiles/me?api-version=7.1" \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query "{id: id, displayName: displayName}" -o table

      # Publishes the same file the GitHub release carries. A re-run, which
      # skips the build, takes it from the release.
      - name: Publish to the Marketplace
        if: steps.marketplace.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v${{ steps.version.outputs.value }}
        run: |
          vsix_path="$(find . -maxdepth 1 -type f -name '*.vsix' -print -quit)"
          if [ -z "$vsix_path" ]; then
            gh release download "$TAG_NAME" --pattern '*.vsix' --repo "$GITHUB_REPOSITORY"
            vsix_path="$(find . -maxdepth 1 -type f -name '*.vsix' -print -quit)"
          fi
          test -n "$vsix_path"
          npx vsce publish --packagePath "$vsix_path" --azure-credential

      # A version already released keeps its notes in step with its section
      # of the changelog, which a later merge may have corrected.
      - name: Update the release notes from the changelog
        if: steps.tag.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v${{ steps.version.outputs.value }}
        run: |
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "The changelog has no section for $TAG_NAME."
            exit 0
          fi
          gh release view "$TAG_NAME" --json body --jq .body > "$RUNNER_TEMP/current.md" || exit 0
          if diff -q -B <(sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' "$RUNNER_TEMP/current.md") <(sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' "$RUNNER_TEMP/notes.md") > /dev/null; then
            echo "$TAG_NAME already says what the changelog does."
            exit 0
          fi
          gh release edit "$TAG_NAME" --notes-file "$RUNNER_TEMP/notes.md" --repo "$GITHUB_REPOSITORY"

  sync-notes:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      # Each release the changelog has a section for says what that section
      # does; one it has none for keeps the notes it was given.
      - name: Rewrite each release's notes from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName --jq '.[].tagName' | while read -r tag; do
            node scripts/changelog.js notes "${tag#v}" > "$RUNNER_TEMP/notes.md"
            if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
              echo "$tag: no section in the changelog, left as it is."
              continue
            fi
            gh release view "$tag" --json body --jq .body > "$RUNNER_TEMP/current.md"
            if diff -q -B <(sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' "$RUNNER_TEMP/current.md") <(sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' "$RUNNER_TEMP/notes.md") > /dev/null; then
              echo "$tag: already matches."
              continue
            fi
            gh release edit "$tag" --notes-file "$RUNNER_TEMP/notes.md" --repo "$GITHUB_REPOSITORY"
            echo "$tag: rewritten from the changelog."
          done
