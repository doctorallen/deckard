name: Docs

# Builds docs/guide into the GitHub Pages site at deckard.esperinnovations.com,
# in the Replicant theme that docs/site lays out. The guide is plain Markdown
# that also reads on GitHub and ships in the VSIX for Help's Read more, so
# the site is built from the same files: staged beside the screenshots, with
# the links that leave the guide pointed at GitHub, then run through the
# Jekyll GitHub Pages uses, which turns README.md into the index and each
# `.md` link into a link to its page.
#
# Pages must be set once, in the repository's Settings > Pages, to deploy
# from GitHub Actions with deckard.esperinnovations.com as its custom domain;
# a workflow deployment takes its domain from there, not from a CNAME file.
# The domain's DNS needs a CNAME record pointing at doctorallen.github.io.

on:
  push:
    branches:
      - master
    paths:
      - docs/guide/**
      - docs/images/**
      - docs/site/**
      - resources/lockup.png
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Stage the guide, its screenshots, and the site's layout
        run: |
          mkdir -p site/images
          cp docs/guide/*.md site/
          cp docs/images/* site/images/
          # The layout, the Replicant stylesheet, and the config, with the
          # README's lockup in the header and the logo as the tab's icon.
          cp -R docs/site/. site/
          cp resources/lockup.png resources/logo.png site/images/
          # The header's tagline is the extension's own description.
          node -e '
            const fs = require("fs");
            const description = require("./package.json").description;
            const config = fs.readFileSync("site/_config.yml", "utf8")
              .replace(/^description: .*$/m, "description: " + JSON.stringify(description));
            fs.writeFileSync("site/_config.yml", config);
          '
          repo="https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}"
          # Screenshots sit beside the pages here; files outside the guide are read on GitHub.
          sed -i \
            -e 's#\.\./images/#images/#g' \
            -e "s#](\.\./\.\./\([^)]*\))#](${repo}/\1)#g" \
            -e "s#](\.\./\([^)]*\))#](${repo}/docs/\1)#g" \
            site/*.md

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
