name: Docs

# Builds docs/guide into the GitHub Pages site. The guide is plain Markdown
# that also reads on GitHub and ships in the VSIX for Help's Read more, so
# the site is built from the same files: staged beside the screenshots, with
# the links that leave the guide pointed at GitHub, then run through the
# Jekyll GitHub Pages uses, which turns README.md into the index and each
# `.md` link into a link to its page.
#
# Pages must be set to deploy from GitHub Actions once, in the repository's
# Settings > Pages.

on:
  push:
    branches:
      - master
    paths:
      - docs/guide/**
      - docs/images/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Stage the guide and its screenshots
        run: |
          mkdir -p site/images
          cp docs/guide/*.md site/
          cp docs/images/* site/images/
          repo="https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}"
          # Screenshots sit beside the pages here; files outside the guide are read on GitHub.
          sed -i \
            -e 's#\.\./images/#images/#g' \
            -e "s#](\.\./\.\./\([^)]*\))#](${repo}/\1)#g" \
            -e "s#](\.\./\([^)]*\))#](${repo}/docs/\1)#g" \
            site/*.md
          cat > site/_config.yml <<'CONFIG'
          title: Deckard guide
          description: A local-first second brain for the Markdown notes in your VS Code workspace.
          theme: jekyll-theme-primer
          CONFIG

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
